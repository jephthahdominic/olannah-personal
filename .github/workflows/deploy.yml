name: Build, Test, and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  test-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: cd backend && pytest -v

  test-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd frontend && npm ci
      # Architecture and quality gates (SDD 18.1). A broken build must never reach the deploy job.
      - run: cd frontend && npm run tokens:check
      - run: cd frontend && npm run contrast
      - run: cd frontend && npm run lint:styles
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm test
      - run: cd frontend && npm run build

  build-and-push-backend:
    needs: [detect-changes, test-backend]
    if: github.event_name == 'push' && needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - run: |
          IMAGE=${{ steps.ecr-login.outputs.registry }}/app-backend
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest backend/
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  build-and-push-frontend:
    needs: [detect-changes, test-frontend]
    if: github.event_name == 'push' && needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - run: |
          IMAGE=${{ steps.ecr-login.outputs.registry }}/app-frontend
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest frontend/
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy:
    needs: [test-backend, test-frontend, build-and-push-backend, build-and-push-frontend]
    if: |
      always() && github.event_name == 'push' &&
      needs.test-backend.result != 'failure' &&
      needs.test-frontend.result != 'failure' &&
      (needs.build-and-push-backend.result == 'success' || needs.build-and-push-frontend.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - uses: actions/checkout@v4
      - run: |
          for i in 1 2 3 4 5; do
            scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              infra/environments/dev/docker-compose.deploy.yml ec2-user@olannah-dev:/home/ec2-user/app/docker-compose.yml && exit 0
            echo "SCP attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1
      - run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ec2-user@olannah-dev \
            "cd /home/ec2-user/app && docker compose pull && docker compose up -d && docker compose images"
